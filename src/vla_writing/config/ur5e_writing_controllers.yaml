# Gazebo ros_control controllers for the official UR5e model.
# The hardware interface is EffortJointInterface, matching the default passed
# to ur_robot_gazebo in writing_scene.urdf.xacro.  MoveIt can send a standard
# FollowJointTrajectory goal to ``eff_joint_traj_controller``.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 500

eff_joint_traj_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gains:
    shoulder_pan_joint: {p: 4000.0, d: 200.0, i: 1.0, i_clamp: 1.0}
    shoulder_lift_joint: {p: 10000.0, d: 200.0, i: 1.0, i_clamp: 1.0}
    elbow_joint: {p: 2000.0, d: 20.0, i: 1.0, i_clamp: 1.0}
    wrist_1_joint: {p: 500.0, d: 1.0, i: 1.0, i_clamp: 1.0}
    wrist_2_joint: {p: 500.0, d: 1.0, i: 1.0, i_clamp: 1.0}
    wrist_3_joint: {p: 10.0, d: 0.1, i: 0.0, i_clamp: 1.0}
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    shoulder_pan_joint: {trajectory: 0.1, goal: 0.1}
    shoulder_lift_joint: {trajectory: 0.1, goal: 0.1}
    elbow_joint: {trajectory: 0.1, goal: 0.1}
    wrist_1_joint: {trajectory: 0.1, goal: 0.1}
    wrist_2_joint: {trajectory: 0.1, goal: 0.1}
    wrist_3_joint: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: 500
  action_monitor_rate: 10

# Kept stopped by default.  A force-control teammate can switch to this
# controller (or replace it with a ROS 2 effort/impedance loop) without
# changing the robot description or the writing trajectory contract.
joint_group_eff_controller:
  type: effort_controllers/JointGroupEffortController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

# Optional position controller for quick smoke tests.  It is loaded stopped.
pos_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  constraints:
    goal_time: 1.0
    stopped_velocity_tolerance: 0.05
    # Gazebo's simple position backend can lag a fast, heavily sampled
    # Cartesian trajectory by a few hundredths of a radian.  These tolerances
    # are still tight enough for a visible writing demo and avoid spurious
    # PATH/GOAL_TOLERANCE_VIOLATED aborts.
    shoulder_pan_joint: {trajectory: 0.20, goal: 0.02}
    shoulder_lift_joint: {trajectory: 0.20, goal: 0.02}
    elbow_joint: {trajectory: 0.20, goal: 0.02}
    wrist_1_joint: {trajectory: 0.20, goal: 0.02}
    wrist_2_joint: {trajectory: 0.20, goal: 0.02}
    wrist_3_joint: {trajectory: 0.20, goal: 0.02}

# Name expected by the stock ur5e_moveit_config controller manager.  It uses
# the same effort interface as eff_joint_traj_controller; choose this name in
# launch/moveit.launch so MoveIt can execute without modifying the upstream
# package.  Do not start both trajectory controllers at once (they command the
# same six joints).
scaled_pos_joint_traj_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gains:
    shoulder_pan_joint: {p: 4000.0, d: 200.0, i: 1.0, i_clamp: 1.0}
    shoulder_lift_joint: {p: 10000.0, d: 200.0, i: 1.0, i_clamp: 1.0}
    elbow_joint: {p: 2000.0, d: 20.0, i: 1.0, i_clamp: 1.0}
    wrist_1_joint: {p: 500.0, d: 1.0, i: 1.0, i_clamp: 1.0}
    wrist_2_joint: {p: 500.0, d: 1.0, i: 1.0, i_clamp: 1.0}
    wrist_3_joint: {p: 10.0, d: 0.1, i: 0.0, i_clamp: 1.0}
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
  stop_trajectory_duration: 0.5
  state_publish_rate: 500
  action_monitor_rate: 10
